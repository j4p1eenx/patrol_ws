name: ROS 2 Workspace CI
on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run ROS 2 CI Action
        uses: ros-tooling/action-ros-ci@v0.3
        with:
          package-name: my_nav2_pkg
          target-ros2-distro: humble
